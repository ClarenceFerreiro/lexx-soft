name: Live API Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-public-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run CI-compatible live checks
        run: >-
          pytest tests/public/ tests/websocket/ tests/auth/
          --html=reports/live-report.html
          --self-contained-html
          -v --tb=short
          -m "not binance and (not auth or anonymous)"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-api-report
          path: reports/live-report.html
          if-no-files-found: error
          retention-days: 14
